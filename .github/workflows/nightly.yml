name: Nightly Insider Trading Fetch
on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
jobs:
  fetch-and-email:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests yfinance numpy pandas
      - name: Fetch insider data
        run: python scripts/fetch_insider.py
      - name: Fetch key dates
        run: python scripts/fetch_key_dates.py
      - name: Fetch price movement
        run: python scripts/fetch_price_movement.py
      - name: Commit data files
        run: |
          git config user.name "samuelstocks-bot"
          git config user.email "actions@github.com"
          git add data/insider.json data/key_dates.json data/price_movement.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "data: nightly update"
          git pull origin main --rebase --autostash
          git push origin main
      - name: Send email digest
        env:
          SENDER_GMAIL: ${{ secrets.SENDER_GMAIL }}
          SENDER_GMAIL_APP_PASS: ${{ secrets.SENDER_GMAIL_APP_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python scripts/send_email.py
